version: 2

updates:
  # Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # `rand` is pinned to 0.8 because `opaque-ke 4.x` is built on
      # `rand_core 0.6`: the `OsRng` we pass into its OPAQUE APIs must
      # implement that generation's traits. Bumping the major breaks the
      # whole workspace build. Revisit when `opaque-ke` moves to a newer
      # `rand_core`.
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # The dtolnay/rust-toolchain ref pins our MSRV (e.g. @1.95), not an
      # action release. Dependabot keeps "upgrading" it to non-existent Rust
      # versions (see #89, #100), which breaks the MSRV CI job. Bump it
      # manually when the MSRV changes.
      - dependency-name: "dtolnay/rust-toolchain"
