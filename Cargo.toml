[workspace]
resolver = "2"
members = [
    "crates/pergamon-core",
    "crates/pergamon-storage",
    "crates/pergamon-feed",
    "crates/pergamon-extract",
    "crates/pergamon-import",
    "crates/pergamon-export",
    "crates/pergamon-crypto",
    "crates/pergamon-keystore",
    "crates/pergamon-sync",
    "crates/pergamon-cli",
    "crates/pergamon-server",
    "crates/pergamon-sync-server",
    "crates/pergamon-uniffi",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/kafkade/pergamon"
homepage = "https://github.com/kafkade/pergamon"
authors = ["The pergamon authors"]

# Shared dependency versions. Members opt in via `dep = { workspace = true }`.
[workspace.dependencies]
pergamon-core = { path = "crates/pergamon-core", version = "1.0.0" }
pergamon-storage = { path = "crates/pergamon-storage", version = "1.0.0" }
pergamon-feed = { path = "crates/pergamon-feed", version = "1.0.0" }
pergamon-extract = { path = "crates/pergamon-extract", version = "1.0.0" }
pergamon-import = { path = "crates/pergamon-import", version = "1.0.0" }
pergamon-export = { path = "crates/pergamon-export", version = "1.0.0" }
pergamon-crypto = { path = "crates/pergamon-crypto", version = "1.0.0" }
pergamon-keystore = { path = "crates/pergamon-keystore", version = "1.0.0", default-features = false }
pergamon-sync = { path = "crates/pergamon-sync", version = "1.0.0" }

pergamon-server = { path = "crates/pergamon-server", version = "1.0.0" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "cors", "trace", "fs"] }
askama = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", default-features = false, features = ["std", "macros", "formatting", "parsing", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
anyhow = "1"
feed-rs = "2"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
readabilityrs = "0.1"
ammonia = "4"
scraper = "0.27"
csv = "1"
url = "2"
base64 = "0.22"
sha2 = "0.11"

# End-to-end encryption (ADR-024). RustCrypto/dalek stack on the digest 0.11
# generation, coherent with the workspace `sha2 = 0.11`. Randomness is sourced
# via the crate's own OS-CSPRNG helpers, so `rand_core` stays at 0.6.
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
hkdf = "0.13"
hmac = "0.13"
argon2 = "0.5"
blake3 = "1"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
lopdf = "0.43"
ratatui = "0.30"
crossterm = "0.29"
open = "5"
zip = { version = "8", default-features = false, features = ["deflate"] }
dirs = "6"
toml = "1.1"

# Mandatory lint set. Members opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = "line-tables-only"
