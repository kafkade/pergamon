# SPDX-License-Identifier: Apache-2.0
[package]
name = "pergamon-sync"
description = "Apache-2.0 client-side sync engine for pergamon (ADR-022/023/024): local change tracking, push/pull with cursors, end-to-end encryption glue, and typed conflict resolution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
# The reqwest-backed HTTP transport. Off by default so the engine and its
# in-memory test double stay dependency-light.
http = ["dep:reqwest"]

[dependencies]
pergamon-core = { workspace = true }
pergamon-storage = { workspace = true }
pergamon-crypto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, optional = true, features = ["json"] }

[dev-dependencies]
tempfile = "3"
