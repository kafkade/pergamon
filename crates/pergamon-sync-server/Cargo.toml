[package]
name = "pergamon-sync-server"
description = "AGPL-3.0 end-to-end-encrypted sync server for pergamon — stores ciphertext only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "pergamon_sync_server"
path = "src/lib.rs"

[[bin]]
name = "pergamon-sync-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, features = ["limit", "load-shed"] }
tower-http = { workspace = true, features = ["limit"] }
# Pre-auth abuse controls: per-IP rate limiting (WP-4, #195). See `src/abuse.rs`.
tower_governor = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
# OPAQUE server-auth identity (WP-3a, ADR-029). NOT co-mingled with the blind
# relay store — see `src/auth/`. `opaque-ke` is dual MIT/Apache-2.0 (usable from
# this AGPL crate); `sha2-opaque` is `sha2 0.10` for the cipher suite (the
# workspace `sha2 = 0.11` above is kept for `ct_hash`).
opaque-ke = { workspace = true }
rand = { workspace = true }
sha2-opaque = { workspace = true }
argon2 = { workspace = true }

[dev-dependencies]
# Apache-2.0 client crypto, used only in tests to prove a real end-to-end
# encrypt -> upload -> download -> decrypt round-trip against the blind server
# (ADR-008 permits an Apache dev-dependency in this AGPL crate).
pergamon-crypto = { workspace = true }
# Apache-2.0 client sync engine + storage, used only in tests to drive two local
# databases through the real router and prove they converge (issue #126). ADR-008
# permits Apache dev-dependencies in this AGPL crate; the server never links them
# at runtime. The `http` feature adds the blocking reqwest relay client, exercised
# over real TCP by the onboarding e2e test (issue #128). The `auth` feature adds
# the OPAQUE client helpers used to drive register/login round-trips (WP-3a, #189).
pergamon-sync = { workspace = true, features = ["http", "auth"] }
pergamon-storage = { workspace = true }
pergamon-core = { workspace = true }
