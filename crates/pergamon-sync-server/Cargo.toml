[package]
name = "pergamon-sync-server"
description = "AGPL-3.0 end-to-end-encrypted sync server for pergamon — stores ciphertext only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "pergamon_sync_server"
path = "src/lib.rs"

[[bin]]
name = "pergamon-sync-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
# Apache-2.0 client crypto, used only in tests to prove a real end-to-end
# encrypt -> upload -> download -> decrypt round-trip against the blind server
# (ADR-008 permits an Apache dev-dependency in this AGPL crate).
pergamon-crypto = { workspace = true }
# Apache-2.0 client sync engine + storage, used only in tests to drive two local
# databases through the real router and prove they converge (issue #126). ADR-008
# permits Apache dev-dependencies in this AGPL crate; the server never links them
# at runtime.
pergamon-sync = { workspace = true }
pergamon-storage = { workspace = true }
pergamon-core = { workspace = true }
